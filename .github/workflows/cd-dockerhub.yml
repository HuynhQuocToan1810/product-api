name: Product API CD - Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Start MongoDB and Product API
        run: docker compose up -d --build

      - name: Check containers health
        run: |
          for i in {1..30}; do
            MONGO_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "missing")
            API_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' product-api 2>/dev/null || echo "missing")

            echo "MongoDB health: $MONGO_HEALTH"
            echo "Product API health: $API_HEALTH"

            if [ "$MONGO_HEALTH" = "healthy" ] && [ "$API_HEALTH" = "healthy" ]; then
              echo "All containers are healthy"
              exit 0
            fi

            sleep 2
          done

          echo "Healthcheck failed"
          docker compose ps
          docker compose logs
          exit 1

      - name: Test GET products
        run: |
          curl -f http://localhost:3000/api/products

      - name: Test POST product
        run: |
          curl -f -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CD001","pname":"CD Product","price":100000,"quantity":10}'

      - name: Test GET product by pid
        run: |
          curl -f http://localhost:3000/api/products/CD001

      - name: Test PUT product
        run: |
          curl -f -X PUT http://localhost:3000/api/products/CD001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Updated CD Product","price":200000,"quantity":20}'

      - name: Test DELETE product
        run: |
          curl -f -X DELETE http://localhost:3000/api/products/CD001

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_toan1810 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t huynhquoctoan1810/product-api:latest .
      - name: Push image to Docker Hub
        run: |
          docker push huynhquoctoan1810/product-api:latest

      - name: Stop containers
        if: always()
        run: docker compose down -v