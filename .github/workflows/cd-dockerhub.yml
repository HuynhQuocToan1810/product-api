name: Product API CD - Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-test-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_toan1810 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t huynhquoctoan1810/product-api:latest .

      - name: Push image to Docker Hub
        run: docker push huynhquoctoan1810/product-api:latest

      - name: Pull latest image from Docker Hub
        run: docker compose -f docker-compose-prod.yaml pull product-api

      - name: Deploy to Local Docker Engine
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Check production containers health
        shell: powershell
        run: |
          for ($i = 1; $i -le 30; $i++) {
            $mongo = docker inspect --format='{{.State.Health.Status}}' mongodb-prod 2>$null
            $api = docker inspect --format='{{.State.Health.Status}}' product-api-prod 2>$null

            Write-Host "MongoDB health: $mongo"
            Write-Host "Product API health: $api"

            if ($mongo -eq "healthy" -and $api -eq "healthy") {
              Write-Host "All production containers are healthy"
              exit 0
            }

            Start-Sleep -Seconds 2
          }

          Write-Host "Healthcheck failed"
          docker compose -f docker-compose-prod.yaml ps
          docker compose -f docker-compose-prod.yaml logs
          exit 1

      - name: Test Product API
        shell: powershell
        run: |
          Invoke-WebRequest http://localhost:3000/api/products -UseBasicParsing

      - name: Show production status
        run: docker compose -f docker-compose-prod.yaml ps